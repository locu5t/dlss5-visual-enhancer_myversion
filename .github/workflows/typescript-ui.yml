name: TypeScript primary UI

on:
  pull_request:
    paths:
      - 'dlss5-visual-enhancer_myversion_typescript/**'
      - 'src/typescript_api/**'
      - 'src/realtime/thread_compat.py'
      - 'tools/install_typescript_ui.ps1'
      - 'tools/install_clean_4090.ps1'
      - 'run_typescript_ui.bat'
      - 'start.bat'
      - 'start_4090.bat'
      - 'tests/test_typescript_main_ui.py'
      - 'tests/test_realtime_thread_compat.py'
      - '.github/workflows/typescript-ui.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dlss5-visual-enhancer_myversion_typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  python-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile TypeScript API backend
        run: python -m compileall -q src/typescript_api
      - name: Run TypeScript architecture regressions
        run: python -m unittest discover -s tests -p 'test_typescript_main_ui.py' -v
      - name: Run realtime Thread compatibility regression
        run: python -m unittest discover -s tests -p 'test_realtime_thread_compat.py' -v
